spring.application.name=TicketFlow

# Database (override with environment variables in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by Flyway (db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# JWT
jwt.secret=${JWT_SECRET_KEY:change-this-development-secret-to-a-long-random-key-of-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.org.springframework.security=INFO